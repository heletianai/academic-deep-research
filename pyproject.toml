[project]
name = "academic-deep-research"
version = "0.0.1"
description = "Multi-Agent 学术 DeepResearch with 红蓝对抗 Critic-Defender"
requires-python = ">=3.12"
dependencies = [
    # Stage 1 minimal（已用）
    "openai>=1.50",
    "python-dotenv>=1.0",
    "arxiv>=2.1",
    # Stage 2/3 添加（占位）
    "langgraph>=0.2",
    "langchain>=0.3",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
